# -*- coding: utf-8 -*-
"""
GitHub Actions CI Pipeline
--------------------------
Corre en cada Pull Request a main.
Instala dependencias y corre los tests.
"""

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (ruff)
        run: |
          pip install ruff
          ruff check . --exit-zero

      - name: Run type checker (mypy)
        run: |
          pip install mypy
          mypy domain application infrastructure --ignore-missing-imports --exit-zero

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=nba_predictor --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: nba-predictor
        continue-on-error: true